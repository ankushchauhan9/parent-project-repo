apiVersion: apps/v1
kind: Deployment

metadata:
  name: file-processor

spec:
  replicas: 1

  selector:
    matchLabels:
      app: file-processor

  template:
    metadata:
      labels:
        app: file-processor

    spec:
      containers:
        - name: file-processor

          image: file-processor:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 8080