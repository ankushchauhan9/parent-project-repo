version: '3.9'

services:

  backend:
    build: .
    container_name: file-processor
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      - floci

  teamcity-agent:
    image: teamcity-agent-k8s
    build:
      context: .
      dockerfile: teamcity-agent.Dockerfile
    container_name: teamcity-agent
    user: root
    environment:
      SERVER_URL: http://teamcity-server:8111
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
    restart: unless-stopped
    volumes:
      - floci-data:/app/data

volumes:
  floci-data:
    driver: local
