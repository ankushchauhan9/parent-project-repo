version: '3.9'

services:

  backend:
    build: .
    container_name: file-processor
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      - floci

  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
    restart: unless-stopped
    volumes:
      - floci-data:/app/data

volumes:
  floci-data:
    driver: local