plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation("org.apache.commons:commons-csv:1.14.1")
	implementation 'software.amazon.awssdk:sqs:2.25.53'
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-sqs:3.1.1'
	implementation("software.amazon.awssdk:s3:2.44.12")
	implementation 'software.amazon.awssdk:ssm:2.25.53'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
	implementation 'com.google.cloud:google-cloud-vertexai:1.21.0'
}

tasks.named('test') {
	useJUnitPlatform()
}
