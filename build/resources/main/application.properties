spring.application.name=fileProcessor
spring.servlet.multipart.enabled=true

sqs.region=ap-south-1
sqs.queue.url=/dev/sqs/url
#http://localhost:4566/000000000000/my-queue-dev
sqs.bucket.name=my-bucket-dev

sqs.listener.queue.url=http://localhost:4566/000000000000/my-queue-dev


spring.cloud.aws.region.static=ap-south-1

spring.cloud.aws.credentials.access-key=/dev/spring.cloud.aws.credentials.access-key
spring.cloud.aws.credentials.secret-key=/dev/spring.cloud.aws.credentials.secret-key

spring.cloud.aws.sqs.endpoint=http://localhost:4566

executor.core.pool.size=10
executor.queue.capacity=100